name: Generate raster social preview cards

on:
  push:
    branches:
      - fix/social-preview-raster-cards-20261118
      - publish-arduino-uno-sensor-interfacing-2026-11-20
    paths:
      - 'assets/*.svg'
      - 'assets/*-social.png'
      - scripts/generate_social_cards.py

permissions:
  contents: write

concurrency:
  group: social-card-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install image conversion dependencies
        run: python -m pip install --disable-pip-version-check cairosvg pillow
      - name: Generate page-specific JPEG cards and update metadata
        run: python scripts/generate_social_cards.py
      - name: Commit generated cards and metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social '*.html' */index.html
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Generate raster social preview cards for all pages"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
