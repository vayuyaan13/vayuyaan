<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Arduino Uno LDR analog input wiring</title><desc id="d">An LDR connects from five volts to analog input A0. A ten kilo-ohm resistor connects A0 to ground.</desc><rect width="1200" height="720" rx="24" fill="#fffdf5"/><text x="65" y="72" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18232d">Arduino Uno + LDR voltage divider</text><text x="65" y="112" font-family="Arial,sans-serif" font-size="19" fill="#596672">Bare LDR circuit • check your board and component ratings</text><rect x="760" y="175" width="330" height="420" rx="24" fill="#e8eef2" stroke="#273640" stroke-width="5"/><rect x="820" y="230" width="210" height="120" rx="14" fill="#273640"/><text x="925" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">ARDUINO</text><text x="925" y="318" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#fff">UNO</text><g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#26333d"><text x="800" y="405">5V</text><text x="800" y="475">A0</text><text x="800" y="545">GND</text></g><g stroke-width="6" fill="none" stroke-linecap="round"><path d="M250 245 H410 V405 H760" stroke="#d64b3b"/><path d="M410 405 H650 V475 H760" stroke="#d4a500"/><path d="M410 405 V555 H650 V545 H760" stroke="#287a56"/></g><rect x="175" y="190" width="150" height="110" rx="16" fill="#fff" stroke="#d4a500" stroke-width="5"/><path d="M195 275 L305 215 M195 215 L305 275" stroke="#d4a500" stroke-width="5"/><text x="250" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#26333d">LDR</text><text x="250" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#596672">One lead to 5V</text><text x="410" y="375" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#596672">Junction</text><rect x="345" y="485" width="130" height="105" rx="12" fill="#fff" stroke="#273640" stroke-width="4"/><path d="M355 500 L465 520 L355 540 L465 560 L355 580" fill="none" stroke="#273640" stroke-width="4"/><text x="410" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#26333d">10 kΩ</text><text x="650" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#596672">A0 signal</text><text x="650" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#596672">Ground return</text><rect x="65" y="425" width="220" height="150" rx="14" fill="#fff4c7" stroke="#e6d58d"/><text x="88" y="465" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#26333d">Connections</text><text x="88" y="505" font-family="Arial,sans-serif" font-size="18" fill="#26333d">LDR: 5V → junction</text><text x="88" y="535" font-family="Arial,sans-serif" font-size="18" fill="#26333d">10 kΩ: junction → GND</text><text x="88" y="565" font-family="Arial,sans-serif" font-size="18" fill="#26333d">Junction → A0</text></svg>