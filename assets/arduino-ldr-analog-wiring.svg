<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Correct Arduino Uno LDR voltage divider wiring</title><desc id="desc">5 volts connects through the LDR to one junction. That junction connects to Arduino A0 and through a 10 kilo-ohm resistor to ground.</desc><rect width="1200" height="720" rx="24" fill="#fffdf5"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18232d">Arduino Uno + LDR voltage divider</text><text x="60" y="110" font-family="Arial,sans-serif" font-size="20" fill="#596672">The junction is shared by the LDR, fixed resistor and A0 input</text><g fill="none" stroke="#273640" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M170 250 H285 M435 250 H570 M570 250 H970 V390 H990 M570 250 V420 H760 V455 M760 555 V610"/></g><rect x="285" y="195" width="150" height="110" rx="14" fill="#fff" stroke="#d4a500" stroke-width="5"/><path d="M305 280 L415 220 M305 220 L415 280" fill="none" stroke="#d4a500" stroke-width="5"/><text x="360" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#26333d">LDR</text><text x="170" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#b43b2d">5V</text><circle cx="570" cy="250" r="10" fill="#d4a500" stroke="#273640" stroke-width="3"/><text x="600" y="215" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26333d">Junction</text><text x="600" y="285" font-family="Arial,sans-serif" font-size="19" fill="#596672">A0 measurement point</text><rect x="710" y="455" width="100" height="150" rx="12" fill="#fff" stroke="#273640" stroke-width="5"/><path d="M760 470 L740 485 L780 500 L740 515 L780 530 L760 545" fill="none" stroke="#273640" stroke-width="4"/><text x="760" y="635" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26333d">10 kΩ resistor</text><rect x="990" y="330" width="155" height="130" rx="16" fill="#e8eef2" stroke="#273640" stroke-width="5"/><text x="1067" y="382" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26333d">Arduino</text><text x="1067" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#26333d">A0</text><path d="M725 610 H795 M735 625 H785 M747 640 H773" stroke="#287a56" stroke-width="5" fill="none"/><text x="760" y="680" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#287a56">GND</text><rect x="60" y="420" width="430" height="165" rx="14" fill="#fff4c7" stroke="#e6d58d" stroke-width="2"/><text x="88" y="460" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#26333d">Check the three connections</text><text x="88" y="500" font-family="Arial,sans-serif" font-size="19" fill="#26333d">1. 5V → LDR → junction</text><text x="88" y="535" font-family="Arial,sans-serif" font-size="19" fill="#26333d">2. Junction → Arduino A0</text><text x="88" y="570" font-family="Arial,sans-serif" font-size="19" fill="#26333d">3. Junction → 10 kΩ → GND</text></svg>