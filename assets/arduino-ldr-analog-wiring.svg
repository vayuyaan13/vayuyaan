<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Correct Arduino Uno LDR voltage divider wiring</title><desc id="desc">The LDR connects between 5 volts and a single junction. The junction connects to Arduino A0 and to a 10 kilo-ohm resistor. The other end of the resistor connects to ground.</desc><rect width="1200" height="720" rx="24" fill="#fffdf5"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18232d">Arduino Uno + LDR voltage divider</text><text x="60" y="110" font-family="Arial,sans-serif" font-size="20" fill="#596672">One shared junction connects the sensor, resistor and A0 input</text><g fill="none" stroke="#273640" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M170 250 H285"/><path d="M435 250 H570"/><path d="M570 250 V410 H980"/><path d="M570 410 V510 H700"/><path d="M700 510 V575"/></g><g fill="#fff" stroke="#d4a500" stroke-width="5"><rect x="285" y="195" width="150" height="110" rx="14"/><path d="M305 280 L415 220 M305 220 L415 280" fill="none"/></g><text x="360" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#26333d">LDR</text><text x="170" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#b43b2d">5V</text><circle cx="570" cy="250" r="10" fill="#d4a500" stroke="#273640" stroke-width="3"/><text x="600" y="220" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26333d">Junction</text><text x="600" y="285" font-family="Arial,sans-serif" font-size="19" fill="#596672">A0 measurement point</text><rect x="700" y="460" width="150" height="100" rx="12" fill="#fff" stroke="#273640" stroke-width="5"/><path d="M715 475 L835 495 L715 515 L835 535 L715 550" fill="none" stroke="#273640" stroke-width="4"/><text x="775" y="600" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26333d">10 kΩ resistor</text><text x="775" y="630" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#596672">to GND</text><rect x="980" y="345" width="150" height="130" rx="16" fill="#e8eef2" stroke="#273640" stroke-width="5"/><text x="1055" y="397" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26333d">Arduino</text><text x="1055" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#26333d">A0</text><path d="M665 575 H735 M675 590 H725 M687 605 H713" stroke="#287a56" stroke-width="5" fill="none"/><text x="700" y="655" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#287a56">GND</text><rect x="60" y="430" width="430" height="155" rx="14" fill="#fff4c7" stroke="#e6d58d" stroke-width="2"/><text x="88" y="470" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#26333d">Check the three connections</text><text x="88" y="510" font-family="Arial,sans-serif" font-size="19" fill="#26333d">1. 5V → LDR → junction</text><text x="88" y="545" font-family="Arial,sans-serif" font-size="19" fill="#26333d">2. Junction → Arduino A0</text><text x="88" y="580" font-family="Arial,sans-serif" font-size="19" fill="#26333d">3. Junction → 10 kΩ → GND</text></svg>