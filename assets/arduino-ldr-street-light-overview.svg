<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Arduino LDR street light project overview</title><desc id="d">Arduino Uno reads an LDR voltage divider and switches an LED lamp.</desc><rect width="1200" height="620" rx="28" fill="#f5f7f8"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="bold" fill="#14202a">Automatic street light with Arduino and LDR</text><text x="55" y="108" font-family="Arial" font-size="19" fill="#5e6b76">A low-voltage light-sensing model</text><rect x="65" y="165" width="400" height="360" rx="22" fill="#172c45"/><text x="105" y="215" font-family="Arial" font-size="27" fill="white" font-weight="bold">Arduino Uno</text><rect x="170" y="260" width="190" height="145" rx="12" fill="#1c6d63"/><rect x="225" y="300" width="80" height="65" rx="6" fill="#141c25"/><text x="244" y="341" font-family="Arial" font-size="23" fill="#f7d56b">UNO</text><text x="105" y="455" font-family="Arial" font-size="19" fill="#e3ebf0">A0 reads sensor voltage</text><text x="105" y="488" font-family="Arial" font-size="19" fill="#e3ebf0">D9 controls the LED</text><path d="M465 340 H590" stroke="#c28b00" stroke-width="8"/><path d="M575 325 L595 340 L575 355" stroke="#c28b00" stroke-width="8" fill="none"/><rect x="615" y="165" width="250" height="360" rx="22" fill="white" stroke="#dce3e8" stroke-width="3"/><text x="660" y="215" font-family="Arial" font-size="25" font-weight="bold" fill="#14202a">LDR divider</text><circle cx="740" cy="300" r="34" fill="#ffe08b" stroke="#8b6a1e" stroke-width="4"/><path d="M712 275 L768 325 M768 275 L712 325" stroke="#8b6a1e" stroke-width="4"/><rect x="712" y="380" width="56" height="65" rx="8" fill="#d6b071" stroke="#795b2b" stroke-width="3"/><path d="M740 334 V380 M740 445 V475" stroke="#35434c" stroke-width="5"/><text x="675" y="500" font-family="Arial" font-size="18" fill="#5e6b76">LDR + 10 kΩ</text><path d="M865 340 H970" stroke="#c28b00" stroke-width="8"/><path d="M955 325 L975 340 L955 355" stroke="#c28b00" stroke-width="8" fill="none"/><rect x="990" y="165" width="145" height="360" rx="20" fill="white" stroke="#dce3e8" stroke-width="3"/><path d="M1062 300 V410 M1025 410 H1099" stroke="#35434c" stroke-width="9"/><circle cx="1062" cy="270" r="36" fill="#ffe08b" stroke="#ae7d00" stroke-width="4"/><path d="M1062 220 V200 M1015 245 L1000 230 M1109 245 L1124 230" stroke="#d29d22" stroke-width="5"/><text x="1020" y="480" font-family="Arial" font-size="18" fill="#5e6b76">LED lamp</text><text x="65" y="575" font-family="Arial" font-size="18" fill="#5e6b76">The Arduino compares the sensor reading with your calibrated threshold.</text></svg>