<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc"><title id="title">Compare ultrasonic, reflective IR and ToF sensors</title><desc id="desc">Three panels explain sound echo ranging, reflected infrared threshold detection and optical time-of-flight ranging.</desc><rect width="1000" height="460" rx="20" fill="#f8fafc"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033">Three sensor types, three different jobs</text><g transform="translate(35 90)"><rect width="295" height="320" rx="16" fill="#dff5ef" stroke="#7ac8b5" stroke-width="2"/><text x="147" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#115e59">Ultrasonic</text><rect x="28" y="85" width="90" height="60" rx="8" fill="#16816d"/><circle cx="55" cy="115" r="13" fill="#dbeafe"/><circle cx="91" cy="115" r="13" fill="#dbeafe"/><path d="M120 100Q150 75 180 100T240 100M120 130Q150 155 180 130T240 130" fill="none" stroke="#0f766e" stroke-width="4"/><rect x="242" y="78" width="22" height="75" rx="4" fill="#64748b"/><text x="147" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#134e4a">Measures sound echo time</text><text x="147" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#134e4a">Good for many beginner</text><text x="147" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#134e4a">distance projects</text></g><g transform="translate(352 90)"><rect width="295" height="320" rx="16" fill="#fff0dc" stroke="#f4bd77" stroke-width="2"/><text x="147" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#9a3412">Reflective IR</text><rect x="28" y="85" width="90" height="60" rx="8" fill="#234a8a"/><circle cx="54" cy="115" r="12" fill="#fb923c"/><circle cx="91" cy="115" r="12" fill="#f8fafc"/><path d="M120 115h110" stroke="#ea580c" stroke-width="5" stroke-dasharray="9 8"/><rect x="238" y="78" width="22" height="75" rx="4" fill="#64748b"/><text x="147" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#7c2d12">Often detects reflection</text><text x="147" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">Useful for line or object</text><text x="147" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#7c2d12">presence, not always cm</text></g><g transform="translate(669 90)"><rect width="295" height="320" rx="16" fill="#eee7ff" stroke="#b6a0ef" stroke-width="2"/><text x="147" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#5b21b6">Time-of-Flight</text><rect x="28" y="85" width="90" height="60" rx="8" fill="#4b367c"/><circle cx="56" cy="115" r="12" fill="#d8b4fe"/><path d="M70 115L220 87M70 115L220 143" stroke="#7c3aed" stroke-width="4"/><rect x="238" y="78" width="22" height="75" rx="4" fill="#64748b"/><text x="147" y="205" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#4c1d95">Measures light travel time</text><text x="147" y="244" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#4c1d95">Compact optical ranging</text><text x="147" y="268" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#4c1d95">with model-specific limits</text></g></svg>