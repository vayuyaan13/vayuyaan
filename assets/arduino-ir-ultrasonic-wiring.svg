<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Arduino Uno sensor wiring overview</title><desc id="desc">A wiring overview lists the connections for a digital IR module and an HC-SR04 ultrasonic sensor.</desc><rect width="1200" height="600" rx="28" fill="#f5f7f8"/><text x="52" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#101820">Arduino Uno wiring overview</text><rect x="42" y="100" width="540" height="430" rx="22" fill="#fff" stroke="#e1e6ea" stroke-width="2"/><rect x="618" y="100" width="540" height="430" rx="22" fill="#fff" stroke="#e1e6ea" stroke-width="2"/><text x="74" y="148" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#805d00">Digital IR module</text><rect x="80" y="195" width="175" height="120" rx="14" fill="#155ca8"/><rect x="105" y="218" width="55" height="50" rx="5" fill="#0b2e52"/><circle cx="208" cy="244" r="14" fill="#ffd23f"/><text x="104" y="346" font-family="Arial,sans-serif" font-size="18" fill="#52606b">IR sensor board</text><g font-family="Arial,sans-serif" font-size="22" fill="#303b44"><text x="300" y="220">VCC → rated supply</text><text x="300" y="270">GND → GND</text><text x="300" y="320">OUT → D2</text><path d="M300 234 h220" stroke="#e7a900" stroke-width="4"/><path d="M300 284 h220" stroke="#26313a" stroke-width="4"/><path d="M300 334 h220" stroke="#1686d9" stroke-width="4"/></g><text x="76" y="410" font-family="Arial,sans-serif" font-size="19" fill="#52606b">Check active-HIGH/active-LOW output.</text><text x="76" y="440" font-family="Arial,sans-serif" font-size="19" fill="#52606b">Confirm module voltage before power.</text><text x="650" y="148" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#155ca8">HC-SR04 ultrasonic</text><rect x="656" y="195" width="176" height="120" rx="14" fill="#155ca8"/><circle cx="705" cy="255" r="28" fill="#d7e7f6" stroke="#fff" stroke-width="5"/><circle cx="779" cy="255" r="28" fill="#d7e7f6" stroke="#fff" stroke-width="5"/><g font-family="Arial,sans-serif" font-size="22" fill="#303b44"><text x="865" y="210">VCC → 5V</text><text x="865" y="258">GND → GND</text><text x="865" y="306">TRIG → D9</text><text x="865" y="354">ECHO → D10</text><path d="M865 224 h235" stroke="#e74c3c" stroke-width="4"/><path d="M865 272 h235" stroke="#26313a" stroke-width="4"/><path d="M865 320 h235" stroke="#1686d9" stroke-width="4"/><path d="M865 368 h235" stroke="#2e9b64" stroke-width="4"/></g><text x="652" y="410" font-family="Arial,sans-serif" font-size="19" fill="#52606b">Echo is typically 5V on standard HC-SR04.</text><text x="652" y="440" font-family="Arial,sans-serif" font-size="19" fill="#52606b">Use level shifting with 3.3V controllers.</text><rect x="42" y="552" width="1116" height="28" rx="8" fill="#ffe27a"/><text x="58" y="572" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#101820">Disconnect power before changing wires. Verify the pin labels on your exact module.</text></svg>