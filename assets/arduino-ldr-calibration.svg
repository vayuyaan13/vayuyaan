<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="t d"><title id="t">Calibrate bright and dark LDR readings</title><desc id="d">Record sensor readings in bright and shaded conditions and select a threshold between the measured ranges.</desc><rect width="1200" height="500" rx="28" fill="#f6f8f9"/><text x="55" y="68" font-family="Arial" font-size="34" font-weight="bold" fill="#14202a">Calibrate with readings from your own circuit</text><rect x="70" y="120" width="455" height="235" rx="18" fill="white" stroke="#dfe5e9" stroke-width="3"/><circle cx="165" cy="205" r="42" fill="#ffe08b" stroke="#b38312" stroke-width="4"/><path d="M165 148 V130 M110 205 H92 M220 205 H238 M127 167 L113 153 M203 167 L217 153" stroke="#b38312" stroke-width="5"/><text x="250" y="185" font-family="Arial" font-size="26" font-weight="bold" fill="#14202a">Bright condition</text><text x="250" y="225" font-family="Arial" font-size="20" fill="#5e6b76">Expose the LDR to room light.</text><text x="250" y="275" font-family="Arial" font-size="20" fill="#237153">Record several readings.</text><rect x="675" y="120" width="455" height="235" rx="18" fill="white" stroke="#dfe5e9" stroke-width="3"/><circle cx="770" cy="205" r="42" fill="#6d7884" stroke="#35434c" stroke-width="4"/><path d="M739 174 L801 236 M801 174 L739 236" stroke="#dce4eb" stroke-width="5"/><text x="855" y="185" font-family="Arial" font-size="26" font-weight="bold" fill="#14202a">Shaded condition</text><text x="855" y="225" font-family="Arial" font-size="20" fill="#5e6b76">Cover the LDR safely.</text><text x="855" y="275" font-family="Arial" font-size="20" fill="#237153">Record several readings.</text><path d="M270 405 H930" stroke="#c5cdd3" stroke-width="5"/><path d="M270 395 V415 M930 395 V415" stroke="#c5cdd3" stroke-width="5"/><path d="M485 405 H715" stroke="#d49b18" stroke-width="12"/><text x="350" y="460" font-family="Arial" font-size="22" font-weight="bold" fill="#705300">Choose a threshold between the measured ranges</text></svg>