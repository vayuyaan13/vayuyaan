<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc"><title id="title">How an ultrasonic distance sensor measures distance</title><desc id="desc">A sensor sends sound toward a target and measures the returning echo; the distance calculation divides round-trip travel by two.</desc><rect width="1000" height="420" rx="20" fill="#f8fafc"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#172033">Ultrasonic ranging: the echo travels both ways</text><rect x="60" y="130" width="170" height="130" rx="14" fill="#16816d"/><circle cx="115" cy="195" r="34" fill="#dbeafe" stroke="#334155" stroke-width="6"/><circle cx="180" cy="195" r="34" fill="#dbeafe" stroke="#334155" stroke-width="6"/><text x="145" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#172033">HC-SR04</text><rect x="800" y="112" width="90" height="170" rx="8" fill="#64748b"/><path d="M230 170 Q300 115 370 170 T510 170 T650 170 T800 170" fill="none" stroke="#0f766e" stroke-width="5" stroke-linecap="round"/><path d="M800 222 Q730 277 660 222 T520 222 T380 222 T230 222" fill="none" stroke="#d97706" stroke-width="5" stroke-linecap="round"/><path d="M770 158l30 12-30 12" fill="none" stroke="#0f766e" stroke-width="5" stroke-linejoin="round"/><path d="M260 210l-30 12 30 12" fill="none" stroke="#d97706" stroke-width="5" stroke-linejoin="round"/><text x="500" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#0f766e">Trigger pulse / outgoing sound</text><text x="500" y="265" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#b45309">Returning echo</text><text x="845" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#172033">Target</text><rect x="250" y="330" width="500" height="55" rx="12" fill="#e2e8f0"/><text x="500" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">distance = echo travel time × sound speed ÷ 2</text></svg>