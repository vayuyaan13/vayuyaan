<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">IR object counter</title><desc id="desc">An IR sensor detects an object passing a point and increments a counter.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#2b3c48"/></linearGradient></defs><rect width="1000" height="500" rx="22" fill="url(#bg)"/><text x="45" y="58" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#ffd43b">PROJECT 3 • OBJECT COUNTER</text><rect x="70" y="185" width="210" height="145" rx="16" fill="#14745f" stroke="#7fc9b4" stroke-width="4"/><rect x="120" y="220" width="110" height="70" rx="8" fill="#18232b"/><text x="175" y="263" text-anchor="middle" font-size="18" fill="#ffd43b">ARDUINO</text><rect x="385" y="225" width="130" height="75" rx="12" fill="#1d2c35" stroke="#d4dfe4" stroke-width="4"/><circle cx="420" cy="263" r="18" fill="#ffd43b"/><circle cx="478" cy="263" r="18" fill="#8ca0ac"/><path d="M520 262H600" stroke="#ffd43b" stroke-width="5" stroke-dasharray="10 8"/><rect x="615" y="180" width="260" height="150" rx="12" fill="#d7e2e7"/><rect x="635" y="200" width="220" height="110" rx="8" fill="#102b32"/><text x="745" y="265" text-anchor="middle" font-size="30" fill="#7df2c7">Count: 5</text><rect x="45" y="405" width="910" height="2" fill="#71818b" opacity=".5"/><text x="48" y="450" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Detect transition → Count once → Show total</text><text x="950" y="475" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#b9c7cf">VAYUYAAN • ELECTRONICS &amp; ROBOTICS</text></svg>