<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">IR triggered indicator light</title><desc id="desc">An IR module detects an approaching hand and switches on an indicator LED.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#2b3c48"/></linearGradient></defs><rect width="1000" height="500" rx="22" fill="url(#bg)"/><text x="45" y="58" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#ffd43b">PROJECT 4 • AUTOMATIC INDICATOR</text><rect x="100" y="205" width="240" height="125" rx="16" fill="#1d2c35" stroke="#d4dfe4" stroke-width="4"/><circle cx="170" cy="267" r="28" fill="#26343e" stroke="#ffd43b" stroke-width="5"/><circle cx="270" cy="267" r="28" fill="#26343e" stroke="#ffd43b" stroke-width="5"/><path d="M340 267H505" stroke="#ffd43b" stroke-width="5" stroke-dasharray="10 8"/><path d="M550 235V305M515 270H585" stroke="#ffd43b" stroke-width="6" stroke-linecap="round"/><path d="M690 190l35 30 35-30v70h-70z" fill="#e6edf0"/><path d="M690 260h70l-12 50h-46z" fill="#b8c8d0"/><path d="M705 310h40" stroke="#ffd43b" stroke-width="6"/><circle cx="725" cy="180" r="40" fill="#ffd43b" opacity=".9"/><rect x="45" y="405" width="910" height="2" fill="#71818b" opacity=".5"/><text x="48" y="450" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Object approaches → Sensor output changes → LED on</text><text x="950" y="475" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#b9c7cf">VAYUYAAN • ELECTRONICS &amp; ROBOTICS</text></svg>