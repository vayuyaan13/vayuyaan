<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">IR sensor and ultrasonic sensor comparison</title><desc id="desc">A visual comparison of sensing method, output, best uses and main limitations.</desc><rect width="1200" height="620" rx="28" fill="#f5f7f8"/><text x="52" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#101820">Choose by the job, not just the range</text><rect x="42" y="96" width="1116" height="80" rx="14" fill="#101820"/><text x="70" y="145" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">Project need</text><text x="420" y="145" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffd23f">Reflective IR</text><text x="795" y="145" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#8ccaff">Ultrasonic</text><g font-family="Arial,sans-serif" font-size="22" fill="#303b44"><rect x="42" y="190" width="1116" height="80" rx="12" fill="#fff"/><text x="70" y="237" font-weight="700">Line following</text><text x="420" y="237" fill="#805d00">Good fit for track contrast</text><text x="795" y="237">Usually not the first choice</text><rect x="42" y="280" width="1116" height="80" rx="12" fill="#fff"/><text x="70" y="327" font-weight="700">Distance estimate</text><text x="420" y="327">Basic modules: limited</text><text x="795" y="327" fill="#155ca8">Designed for distance</text><rect x="42" y="370" width="1116" height="80" rx="12" fill="#fff"/><text x="70" y="417" font-weight="700">Close object trigger</text><text x="420" y="417" fill="#805d00">Simple digital output</text><text x="795" y="417">Can work if echo is suitable</text><rect x="42" y="460" width="1116" height="80" rx="12" fill="#fff"/><text x="70" y="507" font-weight="700">Main limitation</text><text x="420" y="507">Surface and ambient IR</text><text x="795" y="507">Weak or angled echoes</text></g><text x="52" y="585" font-family="Arial,sans-serif" font-size="18" fill="#52606b">Actual performance depends on the exact module and test conditions. Check its datasheet.</text></svg>