<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Arduino LDR street light breadboard connection map</title><desc id="d">Connection map: 5V to one LDR leg, the other LDR leg shares a junction with the 10 kilo-ohm resistor and A0 jumper, and the resistor returns to ground. D9 connects through a current-limiting resistor to an LED and ground.</desc><rect width="1200" height="680" rx="24" fill="#f7f9fb"/><text x="55" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#17212b">Breadboard connection map</text><text x="55" y="102" font-family="Arial" font-size="19" fill="#5b6874">Use the electrical connections as your guide; breadboard hole positions vary.</text><rect x="55" y="145" width="1090" height="390" rx="20" fill="#fff" stroke="#cbd5df" stroke-width="3"/><rect x="85" y="180" width="1030" height="40" rx="8" fill="#fff0f0"/><rect x="85" y="460" width="1030" height="40" rx="8" fill="#edf4ff"/><text x="105" y="208" font-family="Arial" font-size="20" font-weight="700" fill="#b33b3b">+ rail (5V)</text><text x="105" y="488" font-family="Arial" font-size="20" font-weight="700" fill="#315f9b">− rail (GND)</text><path d="M240 220 V270 H380" stroke="#d33" stroke-width="6" fill="none"/><rect x="380" y="250" width="150" height="45" rx="8" fill="#f7e8c7" stroke="#98702a" stroke-width="3"/><path d="M395 272 H515" stroke="#98702a" stroke-width="5"/><text x="455" y="238" text-anchor="middle" font-family="Arial" font-size="20" fill="#17212b">LDR</text><path d="M530 272 H670" stroke="#d39b16" stroke-width="6"/><circle cx="670" cy="272" r="10" fill="#d39b16"/><text x="690" y="280" font-family="Arial" font-size="21" font-weight="700" fill="#17212b">Shared junction</text><path d="M670 272 V345" stroke="#d39b16" stroke-width="6"/><rect x="625" y="345" width="90" height="45" rx="7" fill="#e8edf2" stroke="#667786" stroke-width="3"/><path d="M640 367 H700" stroke="#667786" stroke-width="5"/><text x="735" y="375" font-family="Arial" font-size="20" fill="#17212b">10 kΩ resistor</text><path d="M670 390 V460" stroke="#315f9b" stroke-width="6"/><path d="M670 272 V420 H900 V460" stroke="#267b55" stroke-width="5" fill="none"/><text x="825" y="405" font-family="Arial" font-size="20" fill="#267b55">A0 jumper</text><text x="240" y="560" text-anchor="middle" font-family="Arial" font-size="18" fill="#b33b3b">Arduino 5V</text><text x="670" y="560" text-anchor="middle" font-family="Arial" font-size="18" fill="#315f9b">Arduino GND</text><rect x="55" y="585" width="1090" height="65" rx="12" fill="#fff8df" stroke="#e8cf78" stroke-width="2"/><text x="80" y="625" font-family="Arial" font-size="19" fill="#5c4a13">LED branch: D9 → 220–330 Ω resistor → LED anode; LED cathode → GND.</text></svg>