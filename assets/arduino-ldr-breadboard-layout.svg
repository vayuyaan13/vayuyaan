<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Arduino LDR voltage divider breadboard wiring map</title><desc id="d">The LDR connects between the 5 volt rail and a shared sensor row. A 10 kilo-ohm resistor connects that row to ground. A separate jumper connects the shared row to Arduino A0.</desc><rect width="1200" height="680" rx="24" fill="#f7f9fb"/><text x="55" y="62" font-family="Arial" font-size="34" font-weight="700" fill="#17212b">Breadboard connection map</text><text x="55" y="100" font-family="Arial" font-size="19" fill="#5b6874">LDR voltage divider — follow the shared sensor row</text><rect x="70" y="145" width="780" height="420" rx="18" fill="#fff" stroke="#cbd5df" stroke-width="3"/><rect x="100" y="180" width="720" height="42" rx="8" fill="#fff0f0"/><rect x="100" y="495" width="720" height="42" rx="8" fill="#edf4ff"/><text x="120" y="209" font-family="Arial" font-size="21" font-weight="700" fill="#b33b3b">+ rail · 5V</text><text x="120" y="524" font-family="Arial" font-size="21" font-weight="700" fill="#315f9b">− rail · GND</text><path d="M270 222 V295" stroke="#d33" stroke-width="6"/><rect x="230" y="295" width="80" height="48" rx="8" fill="#f7e8c7" stroke="#98702a" stroke-width="3"/><path d="M242 319 H298" stroke="#98702a" stroke-width="5"/><text x="270" y="280" text-anchor="middle" font-family="Arial" font-size="20" fill="#17212b">LDR</text><path d="M270 343 V390 H520" stroke="#d39b16" stroke-width="6" fill="none"/><circle cx="520" cy="390" r="9" fill="#d39b16"/><text x="540" y="380" font-family="Arial" font-size="20" font-weight="700" fill="#17212b">Shared sensor row</text><path d="M520 390 V425" stroke="#d39b16" stroke-width="6"/><rect x="480" y="425" width="80" height="45" rx="7" fill="#e8edf2" stroke="#667786" stroke-width="3"/><path d="M493 447 H547" stroke="#667786" stroke-width="5"/><text x="580" y="455" font-family="Arial" font-size="20" fill="#17212b">10 kΩ resistor</text><path d="M520 470 V495" stroke="#315f9b" stroke-width="6"/><path d="M520 390 H850" stroke="#267b55" stroke-width="6" fill="none"/><rect x="850" y="352" width="270" height="78" rx="12" fill="#edf7f1" stroke="#76a98a" stroke-width="2"/><text x="985" y="383" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#245b3c">Arduino A0</text><text x="985" y="410" text-anchor="middle" font-family="Arial" font-size="17" fill="#245b3c">Connect sensor row here</text><rect x="850" y="455" width="270" height="78" rx="12" fill="#fff8df" stroke="#e8cf78" stroke-width="2"/><text x="985" y="485" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#5c4a13">LED branch (separate)</text><text x="985" y="512" text-anchor="middle" font-family="Arial" font-size="17" fill="#5c4a13">D9 → 220–330 Ω → LED → GND</text><text x="70" y="615" font-family="Arial" font-size="18" fill="#5b6874">The LDR and resistor meet at one row. A0 reads that row; the resistor returns it to GND.</text><text x="70" y="645" font-family="Arial" font-size="18" fill="#5b6874">The drawing is a connection guide, not a hole-by-hole layout. Breadboard designs differ.</text></svg>