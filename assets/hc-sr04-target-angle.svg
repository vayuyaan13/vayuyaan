<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">How target angle affects HC-SR04 readings</title><desc id="desc">Comparison of a flat target perpendicular to the ultrasonic sensor, which reflects sound back, and an angled target that may reflect sound away.</desc>
<rect width="1200" height="520" rx="28" fill="#f6f8f9"/><text x="64" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#15212a">Target angle changes the echo</text><text x="64" y="104" font-family="Arial,sans-serif" font-size="18" fill="#64717d">A weak or missing return can be caused by the target, not just the sensor.</text>
<rect x="65" y="145" width="510" height="315" rx="20" fill="#eef8f1" stroke="#b9d9c3" stroke-width="2"/><rect x="625" y="145" width="510" height="315" rx="20" fill="#fff5e9" stroke="#ead1aa" stroke-width="2"/>
<text x="320" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#24633b">BETTER TEST</text><text x="880" y="185" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#8c581a">DIFFICULT TARGET</text>
<rect x="115" y="260" width="115" height="85" rx="12" fill="#263640"/><circle cx="155" cy="302" r="20" fill="#d7e1e7" stroke="#fff" stroke-width="4"/><circle cx="200" cy="302" r="20" fill="#d7e1e7" stroke="#fff" stroke-width="4"/><path d="M230 285 Q300 235 380 285 M230 302 Q300 302 380 302 M230 320 Q300 370 380 320" fill="none" stroke="#d39a00" stroke-width="5" stroke-dasharray="10 8"/><rect x="380" y="230" width="18" height="145" rx="4" fill="#8ca0ab"/><path d="M395 285 Q330 250 245 285 M395 302 H245 M395 320 Q330 355 245 320" fill="none" stroke="#2f80b7" stroke-width="4" stroke-dasharray="8 8"/><text x="320" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#24633b">Flat face returns sound</text>
<rect x="675" y="260" width="115" height="85" rx="12" fill="#263640"/><circle cx="715" cy="302" r="20" fill="#d7e1e7" stroke="#fff" stroke-width="4"/><circle cx="760" cy="302" r="20" fill="#d7e1e7" stroke="#fff" stroke-width="4"/><path d="M790 285 Q850 235 915 250 M790 302 Q855 300 915 250 M790 320 Q850 365 915 250" fill="none" stroke="#d39a00" stroke-width="5" stroke-dasharray="10 8"/><path d="M930 230 L1000 370" stroke="#8ca0ab" stroke-width="18" stroke-linecap="round"/><path d="M1000 250 L1065 180 M1000 290 L1090 260 M1000 330 L1080 390" stroke="#d46b28" stroke-width="4" stroke-dasharray="8 8"/><text x="880" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#8c581a">Angled face may reflect sound away</text>
<text x="320" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#557363">Use a broad, hard target</text><text x="880" y="442" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#9b7649">Expect weaker or inconsistent echoes</text></svg>