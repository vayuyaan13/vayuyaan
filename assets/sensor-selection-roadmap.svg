<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d"><title id="t">Sensor selection roadmap</title><desc id="d">Choose a sensor based on whether the project needs distance measurement, reflected-light detection or ambient light measurement, then test its output.</desc><rect width="1200" height="320" rx="24" fill="#f6f8fa"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17212b">Choose by what you need to measure</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(45 85)"><rect width="335" height="160" rx="18" fill="#fff" stroke="#d8e0e7" stroke-width="3"/><circle cx="55" cy="55" r="25" fill="#1767a8"/><path d="M42 55 Q55 38 68 55 M37 64 Q55 35 73 64" stroke="#fff" stroke-width="3" fill="none"/><text x="195" y="52" font-size="21" font-weight="700" fill="#17212b">Distance?</text><text x="195" y="84" font-size="17" fill="#52606b">HC-SR04 ultrasonic</text><text x="167" y="128" font-size="16" fill="#805900">Echo timing → distance</text></g><g transform="translate(432 85)"><rect width="335" height="160" rx="18" fill="#fff" stroke="#d8e0e7" stroke-width="3"/><circle cx="55" cy="55" r="25" fill="#1767a8"/><path d="M43 45 L55 34 L67 45 V68 H43 Z" stroke="#fff" stroke-width="3" fill="none"/><text x="195" y="52" font-size="21" font-weight="700" fill="#17212b">Line or object?</text><text x="195" y="84" font-size="17" fill="#52606b">Reflective IR module</text><text x="167" y="128" font-size="16" fill="#805900">Reflected IR → detection</text></g><g transform="translate(819 85)"><rect width="335" height="160" rx="18" fill="#fff" stroke="#d8e0e7" stroke-width="3"/><circle cx="55" cy="55" r="25" fill="#1767a8"/><circle cx="55" cy="55" r="12" stroke="#fff" stroke-width="3" fill="none"/><path d="M55 23 V31 M55 79 V87 M23 55 H31 M79 55 H87" stroke="#fff" stroke-width="3"/><text x="195" y="52" font-size="21" font-weight="700" fill="#17212b">Light level?</text><text x="195" y="84" font-size="17" fill="#52606b">LDR + voltage divider</text><text x="167" y="128" font-size="16" fill="#805900">Resistance change → voltage</text></g></g><text x="600" y="288" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52606b">Always check your exact module’s pinout, supply voltage and output type.</text></svg>