<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">LDR voltage divider principle</title><desc id="d">An LDR and fixed resistor form a series voltage divider between VCC and ground. The midpoint voltage goes to an analog input.</desc><rect width="1200" height="650" rx="24" fill="#fffdf5"/><text x="65" y="75" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18232d">Turn resistance into a measurable voltage</text><text x="65" y="115" font-family="Arial,sans-serif" font-size="19" fill="#596672">LDR on the supply side • fixed resistor to ground</text><g stroke="#273640" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M400 180 V225"/><path d="M400 335 V380"/><path d="M400 470 V515"/><path d="M400 380 H650"/><path d="M650 380 H820"/><path d="M820 380 H900"/><path d="M400 515 H400"/><path d="M400 180 H400"/><path d="M400 515 h-55 m55 0 h55 m-95 18 h80 m-60 18 h40"/></g><g stroke="#d4a500" stroke-width="5" fill="#fff"><rect x="355" y="225" width="90" height="110" rx="12"/><path d="M370 310 L430 250 M370 250 L430 310" stroke="#d4a500" stroke-width="4"/></g><rect x="355" y="380" width="90" height="90" rx="10" fill="#fff" stroke="#273640" stroke-width="5"/><path d="M365 395 L435 410 L365 425 L435 440 L365 455" fill="none" stroke="#273640" stroke-width="4"/><g font-family="Arial,sans-serif" fill="#26333d"><text x="480" y="270" font-size="24" font-weight="700">LDR</text><text x="480" y="302" font-size="19">Variable resistance</text><text x="480" y="420" font-size="24" font-weight="700">Fixed resistor</text><text x="480" y="452" font-size="19">e.g. 10 kΩ starting value</text><text x="400" y="160" text-anchor="middle" font-size="23" font-weight="700">VCC</text><text x="400" y="590" text-anchor="middle" font-size="23" font-weight="700">GND</text><text x="690" y="350" font-size="22" font-weight="700">Vout</text><text x="690" y="415" font-size="18">Measure midpoint</text></g><path d="M900 380 H1000" stroke="#273640" stroke-width="5" fill="none"/><rect x="1000" y="325" width="145" height="110" rx="14" fill="#f4f6f8" stroke="#273640" stroke-width="4"/><text x="1072" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#26333d">Arduino</text><text x="1072" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" fill="#26333d">A0</text><rect x="65" y="505" width="245" height="85" rx="12" fill="#fff4c7" stroke="#e6d58d"/><text x="88" y="540" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#26333d">Formula</text><text x="88" y="570" font-family="Arial,sans-serif" font-size="18" fill="#26333d">Vout = VCC × Rfixed /</text><text x="88" y="592" font-family="Arial,sans-serif" font-size="18" fill="#26333d">(RLDR + Rfixed)</text></svg>