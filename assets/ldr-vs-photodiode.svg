<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">LDR vs Photodiode: Light Sensor Comparison</title>
<desc id="desc">Technical illustration comparing a photoresistor and a photodiode, showing their typical circuit concepts and best-use cases.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf4"/><stop offset="1" stop-color="#f3f6f8"/></linearGradient>
 <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe778"/><stop offset="1" stop-color="#ffc928"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#19232d" flood-opacity=".08"/></filter>
</defs>
