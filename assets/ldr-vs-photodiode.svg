<circle cx="1075" cy="92" r="95" fill="#ffd23f" opacity=".12"/><circle cx="1130" cy="140" r="46" fill="#ffd23f" opacity=".16"/>
<text x="64" y="70" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#8b6b00">VAYUYAAN • SENSOR GUIDE</text>
<text x="64" y="126" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800" fill="#17212a">LDR vs Photodiode</text>
<text x="64" y="160" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5b6873">Both detect light — but their electrical responses are different.</text>
