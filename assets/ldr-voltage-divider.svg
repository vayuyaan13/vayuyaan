<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">LDR and fixed resistor voltage divider connected to Arduino A0</title>
<desc id="desc">Correct voltage-divider layout: five volts connects through an LDR to a junction. The junction connects to Arduino analog input A0 and through a fixed resistor to ground.</desc>
<rect width="1200" height="630" rx="24" fill="#f8fafc"/><rect x="34" y="34" width="1132" height="562" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
<rect x="68" y="64" width="220" height="38" rx="19" fill="#fff1b8"/><text x="178" y="89" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#594500">ARDUINO BASICS</text>
<text x="68" y="150" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17212b">LDR voltage-divider circuit</text><text x="68" y="184" font-family="Arial,sans-serif" font-size="19" fill="#64748b">Convert changing resistance into a voltage an Arduino can read</text>
<g stroke="#263746" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M270 245 H360"/><path d="M470 245 H590"/><path d="M590 245 H835"/><path d="M590 245 V340"/><path d="M590 410 V465"/><path d="M590 465 H670"/>
</g>
<text x="260" y="226" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#263746">5V</text>
<g><rect x="360" y="207" width="110" height="76" rx="10" fill="#fff1b8" stroke="#d6a800" stroke-width="4"/><path d="M374 224 L456 266 M374 246 L438 276" stroke="#d6a800" stroke-width="4" stroke-linecap="round"/><path d="M430 202 L449 183 M442 203 L449 183 L430 189" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M452 218 L471 199 M464 219 L471 199 L452 205" fill="none" stroke="#0d9488" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="415" y="316" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#17212b" text-anchor="middle">LDR</text><text x="415" y="340" font-family="Arial,sans-serif" font-size="16" fill="#64748b" text-anchor="middle">Photoresistor</text></g>
<circle cx="590" cy="245" r="9" fill="#0d9488" stroke="#fff" stroke-width="3"/>
<g><rect x="555" y="340" width="70" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><path d="M590 340 V330 M590 410 V420" stroke="#263746" stroke-width="4"/><text x="650" y="365" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17212b">Fixed resistor</text><text x="650" y="390" font-family="Arial,sans-serif" font-size="17" fill="#64748b">e.g. 10 kΩ*</text></g>
<g><rect x="835" y="200" width="260" height="100" rx="14" fill="#17212b"/><text x="965" y="239" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff" text-anchor="middle">Arduino Uno</text><text x="965" y="273" font-family="Arial,sans-serif" font-size="22" fill="#fcd34d" text-anchor="middle">A0 · Analog input</text></g>
<path d="M835 245 H835" stroke="#263746" stroke-width="5"/>
<g fill="#64748b" font-family="Arial,sans-serif" font-size="17"><text x="68" y="515">The junction between the LDR and fixed resistor is the measurement point.</text><text x="68" y="547">*10 kΩ is a common starting value; select a value suited to your circuit.</text></g>
<path d="M570 465 H610 M577 475 H603 M584 485 H596" stroke="#263746" stroke-width="4" stroke-linecap="round"/>
<text x="620" y="474" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#263746">GND</text>
</svg>