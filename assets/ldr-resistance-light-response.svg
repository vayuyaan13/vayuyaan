<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">How LDR resistance changes with light</title><desc id="d">A conceptual descending curve shows LDR resistance generally decreasing as light intensity increases.</desc><rect width="1200" height="650" rx="24" fill="#fffdf5"/><text x="70" y="78" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#18232d">LDR resistance changes with light</text><text x="70" y="118" font-family="Arial,sans-serif" font-size="19" fill="#596672">Typical behaviour of a common photoresistor (conceptual, not to scale)</text><path d="M145 180 V520 H1080" fill="none" stroke="#26333d" stroke-width="4"/><path d="M145 190 C280 205 330 275 470 340 S780 450 1060 480" fill="none" stroke="#d4a500" stroke-width="9" stroke-linecap="round"/><path d="M145 190 C280 205 330 275 470 340 S780 450 1060 480 L1060 520 L145 520Z" fill="#ffd84d" opacity=".16"/><text x="85" y="190" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#26333d">High</text><text x="85" y="510" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#26333d">Low</text><text x="150" y="560" font-family="Arial,sans-serif" font-size="20" fill="#26333d">Dark</text><text x="1080" y="560" text-anchor="end" font-family="Arial,sans-serif" font-size="20" fill="#26333d">Bright</text><text x="610" y="615" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#26333d">Increasing light intensity →</text><text x="45" y="355" transform="rotate(-90 45 355)" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#26333d">LDR resistance</text><rect x="745" y="160" width="330" height="76" rx="12" fill="#fff" stroke="#e6d58d"/><text x="770" y="192" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#26333d">More light</text><text x="770" y="218" font-family="Arial,sans-serif" font-size="17" fill="#596672">Generally lower resistance</text></svg>