<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">IR sensor placement for a line follower</title><desc id="desc">Top and side views show three sensors aligned across a black track, mounted parallel to the surface at a consistent height. Dimensions are illustrative and should follow the sensor manufacturer's guidance.</desc>
<rect width="1200" height="620" rx="28" fill="#f7f9fb"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">Place sensors evenly and keep them stable</text><text x="55" y="102" font-family="Arial,sans-serif" font-size="20" fill="#52606b">Use the manufacturer's recommended height as your starting point.</text>
<rect x="55" y="145" width="520" height="390" rx="22" fill="#ffffff" stroke="#d8e0e7" stroke-width="3"/><text x="85" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17212b">Top view</text><rect x="260" y="230" width="110" height="260" rx="4" fill="#252d36"/><rect x="190" y="220" width="250" height="110" rx="15" fill="#d9e2e9" stroke="#8799a8" stroke-width="3"/><rect x="215" y="320" width="44" height="64" rx="8" fill="#1767a8"/><rect x="303" y="320" width="44" height="64" rx="8" fill="#1767a8"/><rect x="391" y="320" width="44" height="64" rx="8" fill="#1767a8"/><circle cx="237" cy="371" r="11" fill="#1c2630"/><circle cx="325" cy="371" r="11" fill="#1c2630"/><circle cx="413" cy="371" r="11" fill="#1c2630"/><text x="237" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606b">Left</text><text x="325" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606b">Centre</text><text x="413" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606b">Right</text><path d="M237 430 L325 430 M325 430 L413 430" stroke="#d99000" stroke-width="3"/><path d="M237 422 L237 438 M325 422 L325 438 M413 422 L413 438" stroke="#d99000" stroke-width="3"/><text x="325" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#805900">Keep spacing even</text><text x="325" y="505" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606b">Centre the array on the track</text>
<rect x="610" y="145" width="535" height="390" rx="22" fill="#ffffff" stroke="#d8e0e7" stroke-width="3"/><text x="640" y="190" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17212b">Side view</text><rect x="670" y="255" width="420" height="95" rx="15" fill="#d9e2e9" stroke="#8799a8" stroke-width="3"/><circle cx="725" cy="370" r="48" fill="#222c36"/><circle cx="725" cy="370" r="23" fill="#edbd28"/><circle cx="1020" cy="370" r="48" fill="#222c36"/><circle cx="1020" cy="370" r="23" fill="#edbd28"/><rect x="780" y="340" width="50" height="48" rx="7" fill="#1767a8"/><rect x="855" y="340" width="50" height="48" rx="7" fill="#1767a8"/><rect x="930" y="340" width="50" height="48" rx="7" fill="#1767a8"/><path d="M640 435 H1115" stroke="#252d36" stroke-width="24"/><path d="M805 390 V421 M880 390 V421 M955 390 V421" stroke="#d99000" stroke-width="3" stroke-dasharray="5 5"/><path d="M1070 390 V435 M1060 390 H1080 M1060 435 H1080" stroke="#2677c9" stroke-width="4"/><text x="1090" y="410" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1767a8">Height</text><text x="875" y="480" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52606b">Keep the board parallel to the track</text><text x="875" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606b">Illustration only — follow your module's specifications</text>
<rect x="55" y="555" width="1090" height="45" rx="12" fill="#fff3c4"/><text x="80" y="584" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#624900">If readings are unstable, check height, angle, surface contrast, ambient light and loose wiring first.</text></svg>