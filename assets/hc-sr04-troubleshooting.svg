<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">HC-SR04 troubleshooting checklist</title><desc id="desc">Four troubleshooting checks for missing or unstable distance readings: verify power and ground, confirm trigger and echo pins, use a flat target facing the sensor, and validate measurements at a known distance.</desc>
<rect width="1200" height="650" rx="28" fill="#f5f7f8"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">HC-SR04 troubleshooting checklist</text><text x="60" y="106" font-family="Arial,sans-serif" font-size="20" fill="#596773">Check the hardware and target before rewriting the sketch</text>
<g font-family="Arial,sans-serif"><rect x="70" y="155" width="500" height="175" rx="18" fill="#fff" stroke="#d8e0e5" stroke-width="3"/><circle cx="125" cy="210" r="27" fill="#d94841"/><text x="125" y="219" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">1</text><text x="175" y="207" font-size="25" font-weight="700" fill="#17212b">Power and ground</text><text x="175" y="244" font-size="19" fill="#52606b">Confirm VCC, GND and common ground.</text><text x="175" y="274" font-size="19" fill="#52606b">Check the module's rated supply.</text>
<rect x="630" y="155" width="500" height="175" rx="18" fill="#fff" stroke="#d8e0e5" stroke-width="3"/><circle cx="685" cy="210" r="27" fill="#d9a323"/><text x="685" y="219" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">2</text><text x="735" y="207" font-size="25" font-weight="700" fill="#17212b">TRIG and ECHO pins</text><text x="735" y="244" font-size="19" fill="#52606b">Match wiring to the sketch constants.</text><text x="735" y="274" font-size="19" fill="#52606b">Check the ECHO voltage for your board.</text>
<rect x="70" y="365" width="500" height="175" rx="18" fill="#fff" stroke="#d8e0e5" stroke-width="3"/><circle cx="125" cy="420" r="27" fill="#287bc1"/><text x="125" y="429" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">3</text><text x="175" y="417" font-size="25" font-weight="700" fill="#17212b">Target and angle</text><text x="175" y="454" font-size="19" fill="#52606b">Try a flat, hard target facing the sensor.</text><text x="175" y="484" font-size="19" fill="#52606b">Keep it within the useful measuring range.</text>
<rect x="630" y="365" width="500" height="175" rx="18" fill="#fff" stroke="#d8e0e5" stroke-width="3"/><circle cx="685" cy="420" r="27" fill="#27805b"/><text x="685" y="429" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">4</text><text x="735" y="417" font-size="25" font-weight="700" fill="#17212b">Compare a known distance</text><text x="735" y="454" font-size="19" fill="#52606b">Use a ruler and several readings.</text><text x="735" y="484" font-size="19" fill="#52606b">Check formula, units and timeout.</text></g>
<text x="70" y="600" font-family="Arial,sans-serif" font-size="19" fill="#596773">Change one thing at a time so you can identify the actual cause.</text></svg>