<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">How IR and ultrasonic sensors detect objects</title><desc id="desc">Side-by-side diagrams show infrared light reflecting from a target and ultrasonic sound pulses returning as an echo.</desc><rect width="1200" height="560" rx="28" fill="#f5f7f8"/><text x="56" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#101820">Two sensors, two different methods</text><rect x="36" y="98" width="550" height="414" rx="22" fill="#fff" stroke="#e1e6ea" stroke-width="2"/><rect x="614" y="98" width="550" height="414" rx="22" fill="#fff" stroke="#e1e6ea" stroke-width="2"/><text x="68" y="145" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#805d00">Reflective IR sensor</text><rect x="76" y="230" width="170" height="98" rx="14" fill="#155ca8"/><rect x="95" y="247" width="54" height="62" rx="6" fill="#0b2e52"/><circle cx="193" cy="278" r="20" fill="#ffc928" stroke="#fff" stroke-width="5"/><text x="161" y="358" font-family="Arial,sans-serif" font-size="18" fill="#303b44">IR module</text><path d="M246 253 L402 215" stroke="#e7a900" stroke-width="7" stroke-linecap="round"/><path d="M246 302 L402 343" stroke="#e7a900" stroke-width="7" stroke-linecap="round"/><path d="M390 203 l20 10 -15 14" fill="none" stroke="#e7a900" stroke-width="6"/><path d="M390 354 l20 -10 -15 -14" fill="none" stroke="#e7a900" stroke-width="6"/><rect x="424" y="203" width="66" height="150" rx="8" fill="#26313a"/><text x="420" y="385" font-family="Arial,sans-serif" font-size="18" fill="#303b44">Target surface</text><text x="70" y="435" font-family="Arial,sans-serif" font-size="19" fill="#52606b">Reads reflected light; surface and lighting</text><text x="70" y="462" font-family="Arial,sans-serif" font-size="19" fill="#52606b">can change the detection result.</text><text x="646" y="145" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#155ca8">Ultrasonic sensor</text><rect x="664" y="230" width="170" height="98" rx="14" fill="#155ca8"/><circle cx="712" cy="278" r="28" fill="#d7e7f6" stroke="#fff" stroke-width="5"/><circle cx="786" cy="278" r="28" fill="#d7e7f6" stroke="#fff" stroke-width="5"/><text x="686" y="358" font-family="Arial,sans-serif" font-size="18" fill="#303b44">HC-SR04</text><path d="M842 278 C885 235 912 235 950 278 C912 321 885 321 842 278" fill="none" stroke="#1686d9" stroke-width="6"/><path d="M842 278 C890 204 930 204 976 278 C930 352 890 352 842 278" fill="none" stroke="#1686d9" stroke-width="4" opacity=".7"/><path d="M842 278 H1000" stroke="#1686d9" stroke-width="4" stroke-dasharray="10 9"/><path d="M984 266 l18 12 -18 12" fill="none" stroke="#1686d9" stroke-width="5"/><rect x="1018" y="203" width="66" height="150" rx="8" fill="#26313a"/><text x="1000" y="385" font-family="Arial,sans-serif" font-size="18" fill="#303b44">Target</text><text x="648" y="435" font-family="Arial,sans-serif" font-size="19" fill="#52606b">Times a sound echo to estimate distance;</text><text x="648" y="462" font-family="Arial,sans-serif" font-size="19" fill="#52606b">target angle and material affect the echo.</text></svg>