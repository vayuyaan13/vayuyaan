<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">How HC-SR04 measures distance</title><desc id="desc">An ultrasonic pulse travels from the sensor to a target and returns as an echo. The measured time is a round trip, so distance equals sound speed multiplied by time divided by two.</desc>
<rect width="1200" height="600" rx="28" fill="#f5f7f8"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">Distance comes from echo time</text><text x="60" y="106" font-family="Arial,sans-serif" font-size="20" fill="#596773">The sound travels to the target and back</text>
<rect x="80" y="210" width="190" height="180" rx="18" fill="#18252e"/><circle cx="150" cy="270" r="32" fill="#aebbc4"/><circle cx="150" cy="270" r="19" fill="#52616d"/><circle cx="220" cy="270" r="32" fill="#aebbc4"/><circle cx="220" cy="270" r="19" fill="#52616d"/><text x="175" y="350" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">HC-SR04</text>
<rect x="910" y="175" width="95" height="260" rx="12" fill="#c7d0d6" stroke="#7b8994" stroke-width="4"/><path d="M927 200 H988 M927 230 H988 M927 260 H988 M927 290 H988 M927 320 H988 M927 350 H988 M927 380 H988 M927 410 H988" stroke="#8d9aa4" stroke-width="3"/>
<path d="M275 245 Q580 100 900 245" fill="none" stroke="#d9a51b" stroke-width="9" stroke-linecap="round"/><path d="M885 224 L906 246 L878 251" fill="none" stroke="#d9a51b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M900 335 Q580 480 275 335" fill="none" stroke="#2375b9" stroke-width="9" stroke-linecap="round"/><path d="M296 313 L273 336 L301 340" fill="none" stroke="#2375b9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="430" y="145" width="330" height="52" rx="12" fill="#fff4cf"/><text x="595" y="179" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#795800">Outgoing pulse</text><rect x="430" y="390" width="330" height="52" rx="12" fill="#e0f0ff"/><text x="595" y="424" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#165a90">Returning echo</text>
<rect x="310" y="485" width="580" height="72" rx="16" fill="#18252e"/><text x="600" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#d6dee4">Approximate distance (cm)</text><text x="600" y="544" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#ffd23f">echo time (µs) × 0.0343 ÷ 2</text>
</svg>