<g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="740" y="245" width="325" height="34" rx="8" fill="#fff"/><text x="755" y="269" fill="#b32e29">VCC → 5V</text><rect x="740" y="295" width="325" height="34" rx="8" fill="#fff"/><text x="755" y="319" fill="#8c6500">TRIG → Digital pin 9</text><rect x="740" y="345" width="325" height="34" rx="8" fill="#fff"/><text x="755" y="369" fill="#145b94">ECHO → Digital pin 10</text><rect x="740" y="395" width="325" height="34" rx="8" fill="#fff"/><text x="755" y="419" fill="#46515a">GND → GND</text></g>
<text x="70" y="615" font-family="Arial,sans-serif" font-size="18" fill="#596773">For 3.3 V boards, check the Echo voltage requirement and use level conversion when needed.</text></svg>