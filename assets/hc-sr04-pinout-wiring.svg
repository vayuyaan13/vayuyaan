<title id="title">HC-SR04 pinout and Arduino Uno wiring</title><desc id="desc">Original educational diagram showing VCC to 5V, TRIG to digital pin 9, ECHO to digital pin 10, and GND to GND.</desc>
<rect width="1200" height="650" rx="28" fill="#f5f7f8"/><text x="60" y="68" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">HC-SR04 → Arduino Uno R3</text><text x="60" y="105" font-family="Arial,sans-serif" font-size="20" fill="#596773">Example wiring · check the labels on your own modules</text>
<rect x="70" y="155" width="420" height="390" rx="22" fill="#18252e"/><text x="280" y="198" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">HC-SR04</text>
<circle cx="205" cy="280" r="62" fill="#d5dce1" stroke="#aab6bf" stroke-width="8"/><circle cx="355" cy="280" r="62" fill="#d5dce1" stroke="#aab6bf" stroke-width="8"/><circle cx="205" cy="280" r="42" fill="#8797a2"/><circle cx="355" cy="280" r="42" fill="#8797a2"/><circle cx="205" cy="280" r="27" fill="#28343d"/><circle cx="355" cy="280" r="27" fill="#28343d"/>
