<text x="178" y="89" font-family="Arial,sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1d4ed8">SENSOR CIRCUITS</text>
<text x="68" y="150" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#17212b">Photodiode signal path</text>
<text x="68" y="184" font-family="Arial,sans-serif" font-size="19" fill="#64748b">The circuit converts light-generated current into a usable signal</text>
<g>
<rect x="75" y="255" width="190" height="155" rx="16" fill="#fff1b8" stroke="#d6a800" stroke-width="3"/>
