<text x="170" y="304" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#594500">Incoming</text>
<text x="170" y="328" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#594500">light</text>
<text x="170" y="366" font-family="Arial,sans-serif" font-size="15" fill="#594500">Optical signal</text>
</g>
