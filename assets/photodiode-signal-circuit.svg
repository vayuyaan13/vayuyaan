<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Photodiode signal conditioning overview</title>
<desc id="desc">A conceptual block diagram shows incoming light reaching a photodiode, its small current entering a signal-conditioning stage, and a converted voltage going to a microcontroller analog input.</desc>
<rect width="1200" height="630" rx="24" fill="#f8fafc"/>
<rect x="34" y="34" width="1132" height="562" rx="20" fill="#fff" stroke="#e2e8f0" stroke-width="2"/>
