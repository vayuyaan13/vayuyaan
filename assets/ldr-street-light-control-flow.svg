<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Arduino LDR automatic street-light control flow</title><desc id="desc">Ambient light changes LDR resistance. A voltage divider sends a voltage to Arduino analog input A0. The program compares the reading with a calibrated threshold and switches an LED through a current-limiting resistor.</desc>
<defs><style>.bg{fill:#f7f9fb}.panel{fill:#fff;stroke:#d9e1e7;stroke-width:2}.head{font:700 25px Arial,sans-serif;fill:#18232b}.sub{font:16px Arial,sans-serif;fill:#52616c}.small{font:14px Arial,sans-serif;fill:#596873}.label{font:700 16px Arial,sans-serif;fill:#202a32}.wire{fill:none;stroke:#d49a16;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.signal{fill:none;stroke:#2878b9;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.green{fill:#eaf6ef;stroke:#69a982;stroke-width:2}.yellow{fill:#fff7d9;stroke:#e7bd43;stroke-width:2}.blue{fill:#edf5fc;stroke:#78a9d1;stroke-width:2}.arrow{fill:#52616c}</style></defs>
<rect class="bg" width="1200" height="560" rx="22"/><text x="56" y="58" class="head">How the automatic street-light model works</text><text x="56" y="88" class="sub">A sensor reading becomes a simple ON/OFF decision — calibrate the threshold for your own circuit.</text>
<rect x="48" y="130" width="250" height="310" rx="16" class="panel"/><text x="74" y="170" class="label">1. Sense ambient light</text><circle cx="170" cy="260" r="58" fill="#fff4ce" stroke="#e3b83f" stroke-width="3"/><circle cx="170" cy="260" r="24" fill="#d6a34b" stroke="#8b6b32" stroke-width="3"/><path d="M155 247h30M155 260h30M155 273h30" stroke="#8b6b32" stroke-width="4" stroke-linecap="round"/><path d="M80 215l28 15M77 260h36M80 305l28-15" stroke="#e3b83f" stroke-width="5" stroke-linecap="round"/><text x="74" y="355" class="small">LDR resistance changes</text><text x="74" y="379" class="small">with the light falling on it.</text><text x="74" y="410" class="small">Darker → higher resistance</text>
<path d="M298 285h42" class="wire"/><path d="M329 275l12 10-12 10" class="arrow"/><rect x="348" y="130" width="250" height="310" rx="16" class="panel"/><text x="374" y="170" class="label">2. Create a voltage</text><text x="374" y="205" class="small">5 V</text><path d="M410 215v32" class="wire"/><rect x="392" y="247" width="36" height="56" rx="5" class="yellow"/><text x="442" y="280" class="small">LDR</text><path d="M410 303v28h55" class="wire"/><circle cx="465" cy="331" r="6" fill="#2878b9"/><path d="M465 331v26" class="signal"/><rect x="447" y="357" width="36" height="48" rx="5" class="blue"/><text x="493" y="386" class="small">10 kΩ</text><path d="M465 405v20" class="wire"/><path d="M448 425h34M453 433h24M459 441h12" stroke="#52616c" stroke-width="3"/><text x="374" y="468" class="small">Divider midpoint → A0</text>
<path d="M598 285h42" class="signal"/><path d="M629 275l12 10-12 10" class="arrow"/><rect x="648" y="130" width="250" height="310" rx="16" class="panel"/><text x="674" y="170" class="label">3. Compare the reading</text><rect x="696" y="218" width="154" height="120" rx="12" class="blue"/><text x="773" y="252" text-anchor="middle" class="label">Arduino</text><text x="773" y="280" text-anchor="middle" class="small">analogRead(A0)</text><text x="773" y="306" text-anchor="middle" class="small">0–1023 (Uno)</text><path d="M773 338v34" class="signal"/><text x="773" y="399" text-anchor="middle" class="small">Compare with threshold</text><text x="773" y="422" text-anchor="middle" class="small">set from real readings</text>
<path d="M898 285h42" class="signal"/><path d="M929 275l12 10-12 10" class="arrow"/><rect x="948" y="130" width="204" height="310" rx="16" class="panel"/><text x="974" y="170" class="label">4. Switch the light</text><path d="M1050 220v42" class="wire"/><path d="M1022 262h56l-28 42z" fill="#fff1bf" stroke="#d49a16" stroke-width="3"/><path d="M1050 304v40" class="wire"/><path d="M1022 344h56M1032 357h36" stroke="#52616c" stroke-width="4"/><text x="1050" y="390" text-anchor="middle" class="small">LED + resistor</text><text x="1050" y="416" text-anchor="middle" class="small">on D9</text>
<rect x="48" y="475" width="1104" height="54" rx="10" class="green"/><text x="72" y="508" class="label">For this wiring:</text><text x="250" y="508" class="sub">More light usually raises A0; darkness lowers A0. Verify with Serial Monitor before choosing a threshold.</text></svg>