<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">How a reflective IR sensor detects a line</title><desc id="desc">An IR LED sends infrared light toward a white surface and a black line. The receiver measures reflected light. Surface response depends on the actual sensor and track.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#f3f6f8"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#e4a11b"/></marker><marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#2677c9"/></marker></defs>
<rect width="1200" height="650" rx="28" fill="url(#bg)"/><text x="55" y="65" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17212b">How a reflective IR sensor reads a line</text><text x="55" y="102" font-family="Arial,sans-serif" font-size="20" fill="#52606b">Infrared light reflects differently from different surfaces.</text>
<rect x="65" y="155" width="390" height="250" rx="22" fill="#ffffff" stroke="#d8e0e7" stroke-width="3"/><text x="95" y="195" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#17212b">Reflective IR module</text>
<rect x="112" y="242" width="290" height="94" rx="14" fill="#1767a8"/><rect x="130" y="258" width="72" height="58" rx="6" fill="#d6e6f2"/><circle cx="257" cy="288" r="27" fill="#1b2835" stroke="#8ab4cf" stroke-width="5"/><circle cx="338" cy="288" r="27" fill="#e7edf2" stroke="#a4b8c6" stroke-width="5"/><rect x="205" y="270" width="32" height="36" rx="4" fill="#e0aa28"/><text x="220" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606b">IR LED</text><text x="338" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#52606b">Receiver</text>
<path d="M250 320 L315 445" stroke="#e4a11b" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><path d="M344 320 L398 445" stroke="#2677c9" stroke-width="7" stroke-linecap="round" marker-end="url(#blueArrow)"/><text x="272" y="421" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#9b6a00">Emitted IR</text><text x="375" y="421" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1767a8">Reflected IR</text>
<rect x="500" y="165" width="300" height="300" rx="20" fill="#ffffff" stroke="#d8e0e7" stroke-width="3"/><text x="530" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212b">Light background</text><rect x="530" y="245" width="240" height="130" rx="8" fill="#f9fafb" stroke="#cbd5df" stroke-width="2"/><path d="M570 300 L600 270 M620 300 L650 270 M670 300 L700 270" stroke="#e4a11b" stroke-width="5" stroke-linecap="round"/><path d="M600 320 L575 350 M650 320 L625 350 M700 320 L675 350" stroke="#2677c9" stroke-width="5" stroke-linecap="round"/><text x="650" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#52606b">Often more reflection</text><text x="650" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52606b">in this example</text>
<rect x="835" y="165" width="300" height="300" rx="20" fill="#ffffff" stroke="#d8e0e7" stroke-width="3"/><text x="865" y="205" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212b">Dark line</text><rect x="865" y="245" width="240" height="130" rx="8" fill="#f9fafb" stroke="#cbd5df" stroke-width="2"/><rect x="935" y="245" width="100" height="130" fill="#202832"/><path d="M900 300 L920 280 M1070 300 L1085 285" stroke="#e4a11b" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 10"/><path d="M955 320 L965 330 M1000 320 L1010 330" stroke="#2677c9" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 10"/><text x="985" y="410" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#52606b">Often less reflection</text><text x="985" y="438" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52606b">in this example</text>
<rect x="65" y="505" width="1070" height="95" rx="16" fill="#fff3c4" stroke="#f0cf65" stroke-width="2"/><text x="95" y="545" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#624900">Calibration rule</text><text x="95" y="578" font-family="Arial,sans-serif" font-size="20" fill="#493f24">Read your own sensor over both surfaces. Output direction and values vary by module, height, lighting and track.</text></svg>