<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d"><title id="t">Arduino learning roadmap</title><desc id="d">Five steps from board basics to reading sensors, controlling motors, building a robot and troubleshooting.</desc><rect width="1200" height="340" rx="24" fill="#f6f8fa"/><text x="40" y="52" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#17212b">Your Arduino learning path</text><g font-family="Arial,sans-serif" text-anchor="middle"><g transform="translate(35 90)"><rect width="205" height="175" rx="18" fill="#fff" stroke="#d8e0e7" stroke-width="3"/><circle cx="102" cy="48" r="28" fill="#1767a8"/><text x="102" y="57" font-size="25" font-weight="700" fill="#fff">1</text><text x="102" y="103" font-size="19" font-weight="700" fill="#17212b">Board basics</text><text x="102" y="132" font-size="15" fill="#52606b">Pins, power, IDE</text></g><path d="M245 178 H270" stroke="#e4a11b" stroke-width="5"/><path d="M262 168 L272 178 L262 188" fill="none" stroke="#e4a11b" stroke-width="5"/><g transform="translate(280 90)"><rect width="205" height="175" rx="18" fill="#fff" stroke="#d8e0e7" stroke-width="3"/><circle cx="102" cy="48" r="28" fill="#1767a8"/><text x="102" y="57" font-size="25" font-weight="700" fill="#fff">2</text><text x="102" y="103" font-size="19" font-weight="700" fill="#17212b">Read sensors</text><text x="102" y="132" font-size="15" fill="#52606b">Digital and analog</text></g><path d="M490 178 H515" stroke="#e4a11b" stroke-width="5"/><path d="M507 168 L517 178 L507 188" fill="none" stroke="#e4a11b" stroke-width="5"/><g transform="translate(525 90)"><rect width="205" height="175" rx="18" fill="#fff" stroke="#d8e0e7" stroke-width="3"/><circle cx="102" cy="48" r="28" fill="#1767a8"/><text x="102" y="57" font-size="25" font-weight="700" fill="#fff">3</text><text x="102" y="103" font-size="19" font-weight="700" fill="#17212b">Control motors</text><text x="102" y="132" font-size="15" fill="#52606b">Driver and PWM</text></g><path d="M735 178 H760" stroke="#e4a11b" stroke-width="5"/><path d="M752 168 L762 178 L752 188" fill="none" stroke="#e4a11b" stroke-width="5"/><g transform="translate(770 90)"><rect width="175" height="175" rx="18" fill="#fff" stroke="#d8e0e7" stroke-width="3"/><circle cx="87" cy="48" r="28" fill="#1767a8"/><text x="87" y="57" font-size="25" font-weight="700" fill="#fff">4</text><text x="87" y="103" font-size="19" font-weight="700" fill="#17212b">Build a robot</text><text x="87" y="132" font-size="15" fill="#52606b">Combine systems</text></g><path d="M950 178 H975" stroke="#e4a11b" stroke-width="5"/><path d="M967 168 L977 178 L967 188" fill="none" stroke="#e4a11b" stroke-width="5"/><g transform="translate(985 90)"><rect width="180" height="175" rx="18" fill="#fff" stroke="#d8e0e7" stroke-width="3"/><circle cx="90" cy="48" r="28" fill="#1767a8"/><text x="90" y="57" font-size="25" font-weight="700" fill="#fff">5</text><text x="90" y="103" font-size="19" font-weight="700" fill="#17212b">Troubleshoot</text><text x="90" y="132" font-size="15" fill="#52606b">Test, tune, repeat</text></g></g><text x="600" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52606b">Learn each subsystem separately before combining it into a larger project.</text></svg>