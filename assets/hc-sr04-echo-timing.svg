<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">HC-SR04 trigger and echo timing diagram</title><desc id="desc">Timing diagram showing a short trigger pulse, an echo pulse whose width represents round-trip travel time, and the timeout case when no echo is received.</desc>
<rect width="1200" height="520" rx="28" fill="#f6f8f9"/><text x="64" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#15212a">What the Arduino measures</text><text x="64" y="104" font-family="Arial,sans-serif" font-size="18" fill="#64717d">The ECHO pulse width is the round-trip travel time.</text>
<g font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#263640"><text x="70" y="190">TRIG</text><text x="70" y="300">ECHO</text><text x="70" y="420">NO ECHO</text></g>
<path d="M190 205 H300 V150 H390 V205 H1080" fill="none" stroke="#d49a00" stroke-width="8" stroke-linejoin="round"/><path d="M190 315 H480 V250 H790 V315 H1080" fill="none" stroke="#2f80b7" stroke-width="8" stroke-linejoin="round"/><path d="M190 435 H1080" fill="none" stroke="#9aa7af" stroke-width="6" stroke-dasharray="10 12"/>
<g stroke="#6b7881" stroke-width="2" stroke-dasharray="5 7"><path d="M300 132 V450"/><path d="M390 132 V450"/><path d="M480 230 V450"/><path d="M790 230 V450"/></g>
<g font-family="Arial,sans-serif" font-size="17" fill="#64717d"><text x="345" y="135" text-anchor="middle">10 µs trigger</text><text x="635" y="235" text-anchor="middle">ECHO HIGH</text><text x="635" y="352" text-anchor="middle" font-weight="700" fill="#2f80b7">pulseIn() measures this width</text><text x="920" y="420" text-anchor="middle">Timeout: pulseIn() returns 0</text><text x="190" y="485">Time →</text></g>
<path d="M480 370 H790 M480 360 V380 M790 360 V380" stroke="#2f80b7" stroke-width="3"/><text x="635" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2f80b7">echoUs (microseconds)</text>
<rect x="820" y="140" width="300" height="118" rx="14" fill="#fff3c4"/><text x="970" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#6c5200">Distance calculation</text><text x="970" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" fill="#17232c">time × sound speed ÷ 2</text><text x="970" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#6c5200">Divide by two for the return trip</text>
</svg>