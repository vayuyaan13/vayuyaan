<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Arduino sensor modules learning hub</title><desc id="d">Illustration of an ultrasonic distance sensor, reflective infrared sensor and light-dependent resistor connected to an Arduino board.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f0f7"/></linearGradient></defs><rect width="1200" height="650" rx="28" fill="url(#g)"/><circle cx="1040" cy="100" r="150" fill="#ffd84d" opacity=".25"/><text x="60" y="75" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#8a6500">SENSOR LEARNING HUB</text><text x="60" y="125" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#17212b">Measure. Detect. Respond.</text><text x="60" y="165" font-family="Arial,sans-serif" font-size="22" fill="#52606b">Choose the right sensor and learn to read its output.</text><g transform="translate(75 230)"><rect width="285" height="250" rx="20" fill="#fff" stroke="#d5e0e9" stroke-width="3"/><text x="142" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">Ultrasonic</text><rect x="45" y="75" width="195" height="100" rx="12" fill="#1767a8"/><circle cx="95" cy="125" r="33" fill="#dce7ef" stroke="#8197a8" stroke-width="5"/><circle cx="190" cy="125" r="33" fill="#dce7ef" stroke="#8197a8" stroke-width="5"/><circle cx="95" cy="125" r="23" fill="#27323c"/><circle cx="190" cy="125" r="23" fill="#27323c"/><text x="142" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52606b">Distance measurement</text></g><g transform="translate(455 230)"><rect width="285" height="250" rx="20" fill="#fff" stroke="#d5e0e9" stroke-width="3"/><text x="142" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">Reflective IR</text><rect x="38" y="80" width="210" height="85" rx="10" fill="#1767a8"/><rect x="58" y="95" width="46" height="50" rx="7" fill="#d8e5ee"/><circle cx="145" cy="122" r="21" fill="#1d2730" stroke="#9db4c5" stroke-width="4"/><circle cx="203" cy="122" r="21" fill="#e9eef2" stroke="#9db4c5" stroke-width="4"/><text x="142" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52606b">Line and object detection</text></g><g transform="translate(835 230)"><rect width="285" height="250" rx="20" fill="#fff" stroke="#d5e0e9" stroke-width="3"/><text x="142" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#17212b">LDR light sensor</text><rect x="48" y="78" width="190" height="88" rx="10" fill="#1767a8"/><circle cx="142" cy="122" r="31" fill="#d4c19b" stroke="#8d7c5c" stroke-width="5"/><path d="M119 105 L165 139 M119 139 L165 105 M142 91 V153 M111 122 H173" stroke="#7b6a4e" stroke-width="4"/><text x="142" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#52606b">Light level sensing</text></g><rect x="75" y="525" width="1045" height="70" rx="16" fill="#17212b"/><text x="600" y="554" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#ffd84d">START WITH THE SIGNAL</text><text x="600" y="579" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#fff">Check power, read the output, test the environment, then write project logic.</text></svg>