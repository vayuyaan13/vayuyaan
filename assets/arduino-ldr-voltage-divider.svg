<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Arduino LDR voltage divider wiring diagram</title><desc id="d">LDR connected from 5 volts to a junction, a 10 kilo-ohm resistor from the junction to ground, and the junction to A0.</desc><rect width="1200" height="620" rx="28" fill="#fbfcfd"/><text x="55" y="70" font-family="Arial" font-size="34" font-weight="bold" fill="#14202a">LDR voltage divider: connect the midpoint to A0</text><rect x="65" y="135" width="285" height="400" rx="22" fill="#172c45"/><text x="105" y="190" font-family="Arial" font-size="27" fill="white" font-weight="bold">Arduino Uno</text><text x="125" y="270" font-family="Arial" font-size="24" fill="white">5V</text><text x="125" y="365" font-family="Arial" font-size="24" fill="white">A0</text><text x="125" y="460" font-family="Arial" font-size="24" fill="white">GND</text><path d="M350 255 H525 V215 H620" stroke="#d49b18" stroke-width="7" fill="none"/><text x="445" y="195" font-family="Arial" font-size="20" fill="#705300">5 V</text><circle cx="680" cy="215" r="43" fill="#ffe08b" stroke="#8b6a1e" stroke-width="5"/><path d="M650 185 L710 245 M710 185 L650 245" stroke="#8b6a1e" stroke-width="5"/><text x="750" y="225" font-family="Arial" font-size="24" fill="#14202a">LDR</text><path d="M620 215 H680 V355" stroke="#35434c" stroke-width="6" fill="none"/><circle cx="680" cy="355" r="9" fill="#d49b18"/><text x="720" y="363" font-family="Arial" font-size="22" font-weight="bold" fill="#14202a">Junction → A0</text><path d="M680 355 H450 V365 H350" stroke="#d49b18" stroke-width="7" fill="none"/><path d="M680 355 V420" stroke="#35434c" stroke-width="6"/><rect x="642" y="420" width="76" height="70" rx="9" fill="#d6b071" stroke="#795b2b" stroke-width="4"/><path d="M658 433 V477 M680 433 V477 M702 433 V477" stroke="#875928" stroke-width="5"/><text x="750" y="463" font-family="Arial" font-size="22" fill="#14202a">10 kΩ resistor</text><path d="M680 490 V520 H450 V460 H350" stroke="#35434c" stroke-width="7" fill="none"/><text x="410" y="555" font-family="Arial" font-size="20" fill="#35434c">GND</text><text x="840" y="555" font-family="Arial" font-size="18" fill="#5e6b76">LDR to 5 V; fixed resistor to GND.</text></svg>