<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Arduino distance sensor types</title><desc id="desc">Illustration comparing ultrasonic, infrared and time-of-flight distance sensors.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#202f45"/></linearGradient></defs><rect width="1200" height="630" rx="28" fill="url(#bg)"/><circle cx="1030" cy="110" r="150" fill="#ffd700" opacity=".08"/><text x="70" y="100" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#ffd700">VAYUYAAN • SENSOR GUIDE</text><text x="70" y="175" font-family="Arial,sans-serif" font-size="49" font-weight="700" fill="#fff">Distance Sensor Types</text><text x="70" y="222" font-family="Arial,sans-serif" font-size="25" fill="#d8e2ee">Ultrasonic vs IR vs Time-of-Flight</text><g transform="translate(65 280)"><rect width="330" height="235" rx="18" fill="#fff" opacity=".07" stroke="#62738a"/><rect x="40" y="55" width="250" height="100" rx="12" fill="#1b8b78" stroke="#a2f3dd" stroke-width="3"/><circle cx="115" cy="105" r="35" fill="#cbd5e1" stroke="#64748b" stroke-width="6"/><circle cx="215" cy="105" r="35" fill="#cbd5e1" stroke="#64748b" stroke-width="6"/><circle cx="115" cy="105" r="22" fill="#334155"/><circle cx="215" cy="105" r="22" fill="#334155"/><text x="165" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">ULTRASONIC</text><text x="165" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#cbd5e1">Sound echo timing</text></g><g transform="translate(435 280)"><rect width="330" height="235" rx="18" fill="#fff" opacity=".07" stroke="#62738a"/><rect x="75" y="55" width="180" height="100" rx="12" fill="#234a8a" stroke="#9cc4ff" stroke-width="3"/><circle cx="125" cy="105" r="20" fill="#f97316"/><path d="M150 105h65" stroke="#fbbf24" strok