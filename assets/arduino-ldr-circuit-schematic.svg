<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">Arduino LDR street light circuit schematic</title><desc id="d">LDR and 10 kilo-ohm resistor form a voltage divider between 5 volts and ground. Their junction connects to A0. An LED connects from digital pin 9 through a 220 to 330 ohm resistor to ground.</desc><rect width="1200" height="620" rx="24" fill="#f7f9fb"/><text x="55" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#17212b">Circuit schematic</text><text x="55" y="102" font-family="Arial" font-size="19" fill="#5b6874">Arduino Uno R3 · LDR voltage divider · LED output</text><rect x="55" y="150" width="300" height="390" rx="18" fill="#fff" stroke="#cbd5df" stroke-width="3"/><text x="205" y="195" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#17212b">Arduino Uno</text><text x="90" y="270" font-family="Arial" font-size="22" fill="#17212b">5V</text><text x="90" y="365" font-family="Arial" font-size="22" fill="#17212b">A0</text><text x="90" y="465" font-family="Arial" font-size="22" fill="#17212b">GND</text><text x="310" y="270" text-anchor="end" font-family="Arial" font-size="22" fill="#17212b">D9</text><path d="M150 260 H430 V220 H650 M150 355 H520 M150 455 H650" fill="none" stroke="#d39b16" stroke-width="5"/><path d="M650 220 V250 M630 250 H670 L650 280 Z M630 292 H670" fill="none" stroke="#273746" stroke-width="5"/><text x="700" y="270" font-family="Arial" font-size="23" fill="#17212b">LDR</text><path d="M650 292 V355 H790" fill="none" stroke="#d39b16" stroke-width="5"/><circle cx="790" cy="355" r="9" fill="#d39b16"/><text x="815" y="363" font-family="Arial" font-size="22" fill="#17212b">A0 junction</text><path d="M790 355 V405 M770 405 H810 L790 435 Z M770 447 H810 M790 447 V500 H650" fill="none" stroke="#273746" stroke-width="5"/><text x="850" y="430" font-family="Arial" font-size="23" fill="#17212b">10 kΩ</text><path d="M650 500 V535 M630 535 H670 M637 545 H663 M644 555 H656" stroke="#273746" stroke-width="4"/><text x="690" y="575" font-family="Arial" font-size="18" fill="#5b6874">GND</text><path d="M310 260 H430 V150 H1000 V250" fill="none" stroke="#d39b16" stroke-width="5"/><text x="470" y="140" font-family="Arial" font-size="18" fill="#8b6500">D9 output</text><path d="M1000 250 V285 M980 285 H1020 L1000 315 Z M980 327 H1020 M1000 327 V365" fill="none" stroke="#273746" stroke-width="5"/><text x="1040" y="310" font-family="Arial" font-size="20" fill="#17212b">220–330 Ω</text><path d="M1000 365 V420 H650 V455" fill="none" stroke="#d39b16" stroke-width="5"/><text x="1040" y="390" font-family="Arial" font-size="21" fill="#17212b">LED</text><text x="55" y="600" font-family="Arial" font-size="17" fill="#5b6874">All grounds must be common. This is a low-voltage LED model, not a mains-light circuit.</text></svg>