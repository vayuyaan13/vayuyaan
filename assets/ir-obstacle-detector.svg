<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">IR obstacle detector</title><desc id="desc">An IR sensor detects a nearby object and triggers an Arduino LED.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101820"/><stop offset="1" stop-color="#2b3c48"/></linearGradient></defs><rect width="1000" height="500" rx="22" fill="url(#bg)"/><text x="45" y="58" font-family="Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="3" fill="#ffd43b">PROJECT 1 • OBSTACLE DETECTOR</text><rect x="80" y="155" width="330" height="190" rx="18" fill="#14745f" stroke="#6bc2aa" stroke-width="4"/><rect x="170" y="190" width="140" height="85" rx="8" fill="#18232b"/><text x="240" y="239" text-anchor="middle" font-size="22" fill="#ffd43b">ARDUINO</text><rect x="490" y="205" width="185" height="80" rx="12" fill="#1d2c35" stroke="#d4dfe4" stroke-width="4"/><circle cx="535" cy="245" r="22" fill="#ffd43b"/><circle cx="625" cy="245" r="22" fill="#ff5c4d"/><rect x="795" y="195" width="80" height="120" rx="8" fill="#b5a17f"/><path d="M680 245H790" stroke="#ffd43b" stroke-width="5" stroke-dasharray="10 8"/><rect x="45" y="405" width="910" height="2" fill="#71818b" opacity=".5"/><text x="48" y="450" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">Sensor detects object → Arduino reads OUT → LED turns on</text><text x="950" y="475" text-anchor="end" font-family="Arial,sans-serif" font-size="14" fill="#b9c7cf">VAYUYAAN • ELECTRONICS &amp; ROBOTICS</text></svg>