<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">HC-SR04 diagnostic test setup</title><desc id="desc">HC-SR04 ultrasonic sensor connected to an Arduino Uno, facing a flat target. Trigger and echo connections are shown, with sound pulses travelling to and returning from the target.</desc>
<rect width="1200" height="560" rx="28" fill="#f6f8f9"/><text x="64" y="68" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#15212a">A controlled HC-SR04 test setup</text><text x="64" y="104" font-family="Arial,sans-serif" font-size="18" fill="#64717d">Keep the target flat, square to the sensor and still while testing.</text>
<rect x="70" y="170" width="330" height="270" rx="22" fill="#17232c"/><rect x="92" y="194" width="286" height="224" rx="12" fill="#253641" stroke="#52616b" stroke-width="3"/><text x="235" y="225" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#fff">ARDUINO UNO</text><rect x="190" y="265" width="90" height="78" rx="8" fill="#101820" stroke="#d5dce0" stroke-width="3"/><text x="235" y="310" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#ffd23f">MCU</text><g fill="#ffd23f"><circle cx="126" cy="257" r="7"/><circle cx="148" cy="257" r="7"/><circle cx="170" cy="257" r="7"/></g><text x="235" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#c8d1d6">Digital pins · D9 / D10</text>
<path d="M400 252 C450 252 470 190 530 190" fill="none" stroke="#d89d00" stroke-width="7"/><path d="M400 315 C465 315 470 335 530 335" fill="none" stroke="#2f80b7" stroke-width="7"/><text x="450" y="224" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#9b7000">TRIG</text><text x="450" y="363" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#2f80b7">ECHO</text>
<rect x="530" y="205" width="220" height="155" rx="18" fill="#fff" stroke="#bcc7ce" stroke-width="3"/><circle cx="590" cy="275" r="37" fill="#dbe5eb" stroke="#53636e" stroke-width="5"/><circle cx="690" cy="275" r="37" fill="#dbe5eb" stroke="#53636e" stroke-width="5"/><circle cx="590" cy="275" r="20" fill="#263640"/><circle cx="690" cy="275" r="20" fill="#263640"/><text x="640" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17232c">HC-SR04</text>
<path d="M755 240 Q830 150 900 240 M755 275 Q840 210 900 275 M755 310 Q830 400 900 310" fill="none" stroke="#d5a000" stroke-width="5" stroke-dasharray="12 10"/><path d="M900 150 L900 405" stroke="#17232c" stroke-width="14"/><path d="M918 150 L918 405" stroke="#aab6bd" stroke-width="5"/><text x="940" y="275" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17232c">Flat target</text><text x="940" y="305" font-family="Arial,sans-serif" font-size="16" fill="#64717d">Face it toward</text><text x="940" y="330" font-family="Arial,sans-serif" font-size="16" fill="#64717d">both transducers</text>
<path d="M755 440 H900" stroke="#17232c" stroke-width="2"/><path d="M755 430 V450 M900 430 V450" stroke="#17232c" stroke-width="2"/><text x="827" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#64717d">Measure with a ruler</text>
<rect x="70" y="485" width="1060" height="42" rx="10" fill="#fff3c4"/><text x="600" y="512" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#6c5200">Disconnect power before changing wires. Verify pin numbers match your sketch.</text></svg>